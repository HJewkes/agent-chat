# CC-637 (PR shape B4): the workflow table, shadow only. Install it as <autonomyRoot>/workflow/shape-v1.yml.
# Source: titan-platform sources/pr-shape-system-plan-2026-10-03.md, 1.2 and 1.3 (paths), 1.5 (priors),
# 2.1 (ladders) and 2.2 (workflow). Every value is a closed enum in src/agents/burndown/workflow-table.ts.
# Plans feed this table: every slice carries `estimate` (points, the same scale as active-work tasks) and `owns` globs,
# and spawns pass `task`. A `slice` spawn argument, the estimate/owns lookup, `profile: "auto"` and spawnRouting
# arrive with CC-1666 F14; until then pick the profile by hand.
version: shape-v1

# Globs matched against a slice's owns, repo-relative.
paths:
  # 1.2 row 2, the door facts that are paths.
  door:
    - .github/**
    - '**/migrations/**'
    - '**/*.migration.*'
    - packages/authority/src/conditions.ts
  # 1.3, v0: the shared entries plus agent-chat's broker, permission, guard and seat sources.
  safety:
    - products/factory/src/shepherd/**
    - packages/authority/**
    - packages/tool-guard/**
    - packages/egress-scan/**
    - packages/hitl/**
    - packages/fix-proof/**
    - packages/evidence/**
    - .codewatch/check.json
    - '**/eslint.config.*'
    - '**/.eslintrc*'
    - src/leak-guard/**
    - '**/hooks/**'
    - src/broker/**
    - src/cli/verbs/permission-hook.ts
    - src/agents/hooks.ts
    - src/agents/*-guard*.ts
    - src/agents/seats/**
  # 1.2 row 4.
  visual:
    - '**/*.stories.tsx'
    - packages/ui/src/components/**
    - apps/console/src/**/*.tsx
    - '**/*.css'
    - '**/__screenshots__/**'
  # 1.2 row 5.
  agentText:
    - '**/CLAUDE.md'
    - '**/AGENTS.md'
    - '**/SKILL.md'
    - '**/skills/**'
    - '**/prompts/**'
    - profiles/**

# 1.5, in order; the first match wins. A row matches when its estimate and done_when conditions hold
# and, if it names owns, ownsOnly, unitsAtLeast or tags, at least one of those does.
priors:
  - { prior: one-way, owns: door, tags: [one-way] }
  - { prior: safety-path, owns: safety, tags: ['kind:security'] }
  - { prior: ui-round, owns: visual }
  - { prior: cross-package, unitsAtLeast: 2 }
  - { prior: agent-text, ownsOnly: agentText }
  - {
      prior: small,
      estimateAtMost: 1,
      needsDoneWhen: true,
      tags: ['kind:docs', 'kind:nit', 'cos:intangible'],
    }
  - { prior: standard, estimateAtMost: 2, needsDoneWhen: true }
  - { prior: needs-plan }

# 2.2, one row per class. implementerAbove2 and planAbove2, when set, apply past estimate 2.
workflow:
  generated: { plan: none, implementer: code, review: ci, merge: MRG-AU-RV }
  release: { plan: none, implementer: code, review: ci, merge: release-path }
  inert: { plan: none, implementer: bd-implementer-lite, review: reviewer, merge: MRG-AU-RV }
  mechanical: { plan: none, implementer: bd-implementer-lite, review: bd-reviewer, merge: MRG-AU-RV }
  agent-text: { plan: none, implementer: bd-implementer, review: bd-reviewer, merge: MRG-AU-RV }
  local-fix:
    plan: none
    implementer: bd-implementer-lite
    implementerAbove2: bd-implementer
    review: bd-reviewer
    merge: MRG-AU-RV
  feature-slice:
    plan: explore
    planAbove2: bd-planner
    implementer: bd-implementer-lite
    implementerAbove2: bd-implementer
    review: bd-reviewer
    merge: MRG-AU-RV
  cross-package: { plan: bd-planner, implementer: bd-implementer, review: fable-reviewer, merge: MRG-AU-RV }
  safety-path: { plan: bd-planner, implementer: bd-implementer, review: fable-reviewer, merge: MRG-AU-RV }
  ui-round: { plan: titan-component-workflow, implementer: bd-implementer, review: bd-reviewer, merge: owner }
  one-way: { plan: fable-architect, implementer: bd-implementer, review: fable-reviewer, merge: owner }

# Which class row gives each prior its implementer. small and standard share the size classes' rule.
priorWorkflow:
  one-way: one-way
  safety-path: safety-path
  ui-round: ui-round
  cross-package: cross-package
  agent-text: agent-text
  small: local-fix
  standard: local-fix
  needs-plan: planner
