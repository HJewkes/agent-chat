name: CI

on:
  push:
    branches: [main]
  # Unfiltered on purpose, and this is a change from the sibling repos rather
  # than an oversight. Work here has branched off long-lived feature branches as
  # often as off main, and a `branches: [main]` filter means those PRs run no
  # checks at all — which is how the filter that looks tidiest ends up gating
  # nothing. Every PR is checked, whatever it targets.
  pull_request:

# A newer push cancels a superseded PR run. Main pushes share one group without
# cancel-in-progress: a newer push replaces a queued run, a running one finishes.
# Owner decision 319 (2026-10-13) reverses the old "every main push runs" choice for queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The whole grant. A called workflow can never hold more than its caller grants,
# and node.yml asks for nothing beyond this.
permissions:
  contents: read

# The shared standard (HJewkes/ci): `std` runs secrets (gitleaks, full history),
# audit, and `npm run verify`, which is format, typecheck, build, the tests, and
# the shadow-ledger rerun. No compat matrix: this package is private, not a
# published library. The live suites (AGENT_CHAT_LIVE) stay skipped: they drive
# real Claude Code sessions and iTerm windows, neither of which exists on a runner.
jobs:
  std:
    uses: HJewkes/ci/.github/workflows/node.yml@v1
    with:
      # HJewkes/ci node.yml has no node-version-file input; keep this equal to .node-version.
      node-version: '24.21.0'

  # A merge gate behind the pre-push hook `prepare` installs. CI has no private term list.
  egress-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lists earlier main runs to find the last one that succeeded.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan reads every commit in the range, not only its endpoints.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # A superseded queued main run never scans its commits, so a main push scans
      # from the last successful main run, not from the previous tip.
      - name: Find the last scanned main commit
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" --jq '.workflow_runs')
          # Assigned on its own line so a node failure fails the step; inside
          # `echo "sha=$(...)"` the exit status would be masked and sha left empty.
          sha=$(node scripts/ci/egress-base.mjs "$GITHUB_SHA" <<<"$runs")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # The PR head sha, not the merge ref, so GitHub's synthetic merge commit is not scanned.
      - name: Scan the pushed commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npx --yes @titan-design/egress-scan@0.1.0 range "$BASE_SHA" "$HEAD_SHA"

  # The ruleset requires the context `check`, so the aggregator carries that name
  # and no other job may. all-green also fails if a job here is missing from needs.
  check:
    if: always()
    needs: [std, egress-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: HJewkes/ci/actions/all-green@v1
        with:
          needs: ${{ toJSON(needs) }}
